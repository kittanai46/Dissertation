services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mysql_nodejs
      MYSQL_USER: class_tracking
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-class_tracking_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-class_tracking_root_dev}
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./13-10-67.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/migrations/001_create_course_conditions.sql:/docker-entrypoint-initdb.d/002_course_conditions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
